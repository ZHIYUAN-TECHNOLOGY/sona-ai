<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1140 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="retrieval-evidence-title retrieval-evidence-desc">
<title id="retrieval-evidence-title">Evidence answers with citations</title>
<desc id="retrieval-evidence-desc">Architecture diagram of an evidence answer: evidence.stream reads PubMed, the patient record and a hybrid full-text plus pgvector search (embedded on sona-embed, reranked on sona-voice) at once, Sona Med writes claims that cite numbered sources, and citation checks keep only claims whose citations hold before the answer and its sources are shown.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="retrieval-evidence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59616b"/></marker>
<marker id="retrieval-evidence-arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d1f23"/></marker>
<marker id="retrieval-evidence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#245bcc"/></marker>
<marker id="retrieval-evidence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f6e66"/></marker>
</defs>
