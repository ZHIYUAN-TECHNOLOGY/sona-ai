<rect x="320" y="48" width="220" height="80" rx="6" fill="#f5f6f8"/>
<rect x="320" y="48" width="220" height="80" rx="6" fill="rgba(29,31,35,0.03)" stroke="rgba(29,31,35,0.3)" stroke-width="1"/>
<rect x="328" y="56" width="40" height="12" rx="2" fill="none" stroke="rgba(29,31,35,0.25)" stroke-width="0.8"/>
<text x="348" y="65" fill="#59616b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PUBLIC</text>
<text x="430" y="88" fill="#1d1f23" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">PubMed</text>
<text x="430" y="104" fill="#59616b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">esearch + efetch, 4 s a call</text>
<text x="430" y="116" fill="#59616b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">≤ 5 studies, cached 7 d</text>
</g>
<g id="retrieval-evidence-n-record">
<rect x="320" y="168" width="220" height="80" rx="6" fill="#f5f6f8"/>
<rect x="320" y="168" width="220" height="80" rx="6" fill="rgba(29,31,35,0.05)" stroke="#59616b" stroke-width="1"/>
