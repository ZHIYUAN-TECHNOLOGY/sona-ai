<text x="140" y="208" fill="#1d1f23" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">evidence.stream</text>
<text x="140" y="224" fill="#59616b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">question, typed or spoken</text>
<text x="140" y="236" fill="#59616b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">steps stream back</text>
</g>
