<text x="354" y="305" fill="#1d1f23" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RETRIEVAL</text>
<text x="430" y="328" fill="#1d1f23" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Hybrid search</text>
<text x="430" y="344" fill="#59616b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">FTS + pgvector, RRF k=60</text>
<text x="430" y="356" fill="#59616b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">chunks: tsvector + HNSW</text>
<text x="430" y="368" fill="#59616b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">50 each, fused</text>
</g>
