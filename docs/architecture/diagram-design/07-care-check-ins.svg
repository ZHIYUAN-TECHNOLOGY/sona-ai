<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1328 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="care-check-ins-title care-check-ins-desc">
      <title id="care-check-ins-title">Sona Care check-ins and care-team tasks</title>
      <desc id="care-check-ins-desc">Swimlane showing discharge scheduling check-ins, the CheckInAgent pushing them to the patient, the reply labelled fine, worse or urgent, and worse or urgent replies becoming a care-team task the doctor books in, with urgent replies also sending a call-999 message.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59616b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#245bcc"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f6e66"/></marker>
        <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d1f23"/></marker>
      </defs>
