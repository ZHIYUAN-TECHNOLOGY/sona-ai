<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-context-title system-context-desc">
      <title id="system-context-title">Sona system context</title>
      <desc id="system-context-desc">Architecture diagram showing hospital staff on Sona Pro, patients on Sona Care and insurers on a one-time link all reaching one Cloudflare Worker, which calls Sona models in AWS Malaysia, Neon Postgres in Singapore, PubMed and notification services, and receives lab results.</desc>
