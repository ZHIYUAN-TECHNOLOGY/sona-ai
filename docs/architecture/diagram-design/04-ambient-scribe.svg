<svg viewBox="0 0 1328 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ambient-scribe-title ambient-scribe-desc">
      <title id="ambient-scribe-title">Ambient scribe: consultation to coded note</title>
      <desc id="ambient-scribe-desc">Swimlane showing a consultation recorded on Sona Pro in 12-second parts, transcribed per speaker on Sona Speech, named by the doctor, drafted and coded by Sona Med, and checked by the Sona server before the doctor saves it.</desc>
