<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="guarantee-letter-title guarantee-letter-desc">
<title id="guarantee-letter-title">Guarantee letter to discharge</title>
<desc id="guarantee-letter-desc">State machine of a guarantee-letter claim: an unstored draft is sent by a doctor, the insurer approves, queries or denies it on the link page, a query or denial can be resent, a denial can be appealed with a new link, and an approved letter lets the doctor discharge the patient.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="guarantee-letter-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59616b"/></marker>
<marker id="guarantee-letter-arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d1f23"/></marker>
<marker id="guarantee-letter-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#245bcc"/></marker>
<marker id="guarantee-letter-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f6e66"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f6f8"/>
<!-- zones -->
