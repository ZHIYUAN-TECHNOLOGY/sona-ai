<rect x="848" y="104" width="40" height="12" rx="2" fill="none" stroke="rgba(36,91,204,0.5)" stroke-width="0.8"/>
<text x="868" y="113" fill="#245bcc" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATUS</text>
<text x="920" y="136" fill="#1d1f23" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">approved</text>
<text x="920" y="152" fill="#59616b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">GL row marked received</text>
</g>
