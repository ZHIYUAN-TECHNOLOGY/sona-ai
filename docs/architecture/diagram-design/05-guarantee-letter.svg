<path d="M232,136 L320,136" fill="none" stroke="#59616b" stroke-width="1.2" marker-end="url(#guarantee-letter-arrow)"/>
<path d="M776,136 L840,136" fill="none" stroke="#245bcc" stroke-width="1.4" marker-end="url(#guarantee-letter-arrow-accent)"/>
