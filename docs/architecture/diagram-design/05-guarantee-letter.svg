<text x="568" y="259" fill="#59616b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESEND</text>
<rect x="928" y="218" width="64" height="12" rx="2" fill="#f5f6f8"/>
<text x="960" y="227" fill="#59616b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DISCHARGE</text>
<!-- nodes -->
<circle cx="40" cy="136" r="6" fill="#1d1f23"/>
<g id="guarantee-letter-n-draft">
<rect x="72" y="96" width="160" height="80" rx="6" fill="#f5f6f8"/>
<rect x="72" y="96" width="160" height="80" rx="6" fill="rgba(29,31,35,0.02)" stroke="rgba(29,31,35,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="80" y="104" width="56" height="12" rx="2" fill="none" stroke="rgba(29,31,35,0.25)" stroke-width="0.8"/>
<text x="108" y="113" fill="#59616b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NOT STORED</text>
<text x="152" y="136" fill="#1d1f23" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">draft</text>
<text x="152" y="152" fill="#59616b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">claim.status returns it</text>
<text x="152" y="164" fill="#59616b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">when no row exists</text>
</g>
