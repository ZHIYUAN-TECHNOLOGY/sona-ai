<text x="400" y="136" fill="#1d1f23" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">sent</text>
<text x="400" y="152" fill="#59616b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">new 7-day link each send</text>
</g>
<g id="guarantee-letter-n-appealed">
<rect x="592" y="96" width="160" height="80" rx="6" fill="#f5f6f8"/>
<rect x="592" y="96" width="160" height="80" rx="6" fill="#ffffff" stroke="#1d1f23" stroke-width="1"/>
<rect x="600" y="104" width="40" height="12" rx="2" fill="none" stroke="rgba(29,31,35,0.4)" stroke-width="0.8"/>
<text x="620" y="113" fill="#1d1f23" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATUS</text>
<text x="672" y="136" fill="#1d1f23" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">appealed</text>
<text x="672" y="152" fill="#59616b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">points cite note sentences</text>
<text x="672" y="164" fill="#59616b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">new link to the insurer</text>
</g>
<g id="guarantee-letter-n-approved">
