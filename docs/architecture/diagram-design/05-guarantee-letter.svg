<text x="480" y="243" fill="#59616b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESEND</text>
<rect x="632" y="234" width="32" height="12" rx="2" fill="#f5f6f8"/>
<text x="648" y="243" fill="#0f6e66" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DENY</text>
