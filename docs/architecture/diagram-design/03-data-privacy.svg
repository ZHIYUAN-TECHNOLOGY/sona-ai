<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 704" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-privacy-title data-privacy-desc">
<title id="data-privacy-title">Where patient data goes</title>
<desc id="data-privacy-desc">Architecture diagram of Sona&#x27;s patient data paths: visit audio, images and patient messages pass through the Sona server on Cloudflare; notes and transcript turns are stored in Postgres in Singapore and images in R2; every model runs in Malaysia, audio is held in memory only, and only evidence, training and scans are de-identified by Sona Privacy while most model calls get text as written.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
