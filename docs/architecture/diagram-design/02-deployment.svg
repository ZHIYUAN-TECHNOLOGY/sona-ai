      <title id="deployment-title">Sona deployment on staging</title>
      <desc id="deployment-desc">Deployment diagram placing the Sona Worker, its Durable Objects and the R2 bucket on Cloudflare with no region pin, Neon Postgres in Singapore, and all six model hosts, five SageMaker endpoints and one Lambda, in AWS Malaysia.</desc>
