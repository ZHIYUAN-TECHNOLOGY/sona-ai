# Box ② Voice: Manglish ASR (fine-tuned Qwen3-ASR-1.7B on vLLM), Malaysian TTS (fine-tuned VoxCPM2 on Nano-vLLM-VoxCPM),
# who spoke when (NVIDIA Nemotron-3-Diarization) and the bge reranker, behind one gateway port (data/gateway.py).
# EmbeddingGemma runs on Workers AI and OpenMed PII on its own CPU box instead
# (docs/handoff.md#baseten-boxes-deployed-30-sep-2026).
# Routes: /environments/production/sync/v1/audio/transcriptions (with a `diarize` field: by voice) | /v1/tts | /v1/rerank
model_name: sona-voice
base_image:
  image: vllm/vllm-openai:v0.29.0-cu129
system_packages:
  - ffmpeg
  - git  # pip needs it for the transformers commit below
build_commands:
  # Constrain what vLLM depends on, so nothing below can swap torch or transformers under it.
  - >-
    python3 -m pip freeze | grep -iE '^(torch|torchvision|triton|transformers|numpy|fastapi|starlette|pydantic|pydantic_core|uvicorn)==' > /tmp/pins.txt &&
    python3 -m pip install --no-cache-dir -c /tmp/pins.txt sentence-transformers httpx virtualenv librosa soundfile
  # librosa and soundfile are how vLLM reads the uploaded audio for transcription.
  - python3 -c "import sentence_transformers, librosa, soundfile, torch; print('gateway deps ok, torch', torch.__version__)"
  # Sona's voice gets its own venv (data/tts_server.py): Nano-vLLM-VoxCPM imports flash-attn, whose prebuilt wheels stop
  # at torch 2.9 while vLLM above needs 2.13. The flash-attn wheel must match torch's C++ ABI.
  - python3 -m virtualenv /opt/tts && /opt/tts/bin/pip install --no-cache-dir torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cu128
  - >-
    ABI=$(/opt/tts/bin/python -c "import torch; print(str(torch._C._GLIBCXX_USE_CXX11_ABI).upper())") &&
    /opt/tts/bin/pip install --no-cache-dir "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3.post1/flash_attn-2.8.3.post1+cu12torch2.8cxx11abi${ABI}-cp312-cp312-linux_x86_64.whl"
  - >-
    printf 'torch==2.8.0\ntorchaudio==2.8.0\ntorchcodec==0.7.0\n' > /tmp/tts-pins.txt &&
    /opt/tts/bin/pip install --no-cache-dir -c /tmp/tts-pins.txt nano-vllm-voxcpm==2.0.4 fastapi uvicorn soundfile
  - /opt/tts/bin/python -c "import flash_attn, torch, nanovllm_voxcpm.models.voxcpm2.server; print('voice deps ok, torch', torch.__version__)"
  # Who spoke when gets a third venv (data/diar_server.py): Nemotron-3-Diarization is not in a released transformers
  # yet, so it runs on the commit it was measured with (tools/diar-eval), which vLLM above must not be moved to.
  - python3 -m virtualenv /opt/diar && /opt/diar/bin/pip install --no-cache-dir torch==2.8.0 --index-url https://download.pytorch.org/whl/cu128
  - >-
    /opt/diar/bin/pip install --no-cache-dir "transformers @ git+https://github.com/huggingface/transformers@d28b79377cdf2a36549bb4b163f1956a70d07926"
    soundfile numpy fastapi uvicorn python-multipart
  - /opt/diar/bin/python -c "import soundfile, python_multipart, torch, transformers.models.nemotron3_diarization; print('diar deps ok, torch', torch.__version__)"
weights:
  - source: "hf://zhiyuantechnology/sona-qwen3-asr-manglish@d62584cd390628614b899ca12aa25fdd39e27fd0"
    mount_location: /app/models/asr
    auth: {auth_method: CUSTOM_SECRET, auth_secret_name: hf_access_token}
  - source: "hf://zhiyuantechnology/sona-voxcpm2-malaysian@bb2b950fe94f3901bf2bcb562e51a35216babee7"
    mount_location: /app/models/tts
    auth: {auth_method: CUSTOM_SECRET, auth_secret_name: hf_access_token}
  - source: "hf://BAAI/bge-reranker-v2-m3@953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
    mount_location: /app/models/rerank
    allow_patterns: ["*.json", "model.safetensors", "sentencepiece.bpe.model", "tokenizer*"]
  - source: "hf://nvidia/Nemotron-3-Diarization@f667ed73aee57d40cc39428eb768b4fd87a0a29e"
    mount_location: /app/models/diar
    allow_patterns: ["config.json", "model.safetensors", "processor_config.json"]
docker_server:
  start_command: python3 /app/data/gateway.py
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/audio/transcriptions
  server_port: 8000
environment_variables:
  VLLM_LOGGING_LEVEL: WARNING
  # From Baseten's Qwen3-ASR recipe: allow whole consultations (up to 65 min, 120 MB) through the decode stage.
  VLLM_MAX_AUDIO_DECODE_DURATION_S: "3900"
  VLLM_MAX_AUDIO_CLIP_FILESIZE_MB: "120"
secrets:
  hf_access_token: null
resources:
  instance_type: "L4:4x16"
runtime:
  health_checks:
    startup_threshold_seconds: 1800
    restart_threshold_seconds: 1200
  predict_concurrency: 32
