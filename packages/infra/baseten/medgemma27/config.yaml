# Box ⑥ MedGemma 27B (text): the medical teacher and benchmark for sona-live's brain (docs/minicpm-o-finetune.md, live4).
# Temporary: scales to zero; deactivate after a teaching run. Needs the Hugging Face account behind hf_access_token to
# have accepted MedGemma's terms (Health AI Developer Foundations).
model_name: sona-medgemma27
base_image:
  image: vllm/vllm-openai:v0.29.0-cu129
weights:
  - source: "hf://google/medgemma-27b-text-it@5b667cf2ddcf064085bc90952edb35a0edbfb79c"
    mount_location: /app/checkpoint/model
    auth:
      auth_method: CUSTOM_SECRET
      auth_secret_name: hf_access_token
    ignore_patterns: [".*"]
docker_server:
  start_command: >-
    vllm serve /app/checkpoint/model
    --served-model-name medgemma-27b
    --host 0.0.0.0 --port 8000
    --max-model-len 8192
    --max-num-seqs 32
    --gpu-memory-utilization 0.92
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000
environment_variables:
  VLLM_LOGGING_LEVEL: WARNING
secrets:
  hf_access_token: null
resources:
  accelerator: H100
  cpu: "4"
  memory: 32Gi
runtime:
  health_checks:
    startup_threshold_seconds: 1800
  predict_concurrency: 32
