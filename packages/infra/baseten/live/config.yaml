# Box ④ Live: Sona's MiniCPM-o 4.5 in full-duplex mode (docs/minicpm-o-plan.md#architecture), one call per replica.
# Brain: live1 (stage 1, then trained in the live format); ear and eyes: stage 1; voice: talker voice-v1
# (docs/minicpm-o-finetune.md#run-log).
# WebSocket: wss://model-<id>.api.baseten.co/environments/production/websocket (protocol: data/live.py).
# Push: baseten model push --dir packages/infra/baseten/live   Check: packages/infra/baseten/live/check.py
model_name: sona-live
base_image:
  # The image every MiniCPM-o training and eval job ran on (tools/omni-train, tools/omni-voice-train).
  image: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
build_commands:
  # The model code's own transformers (4.51; minicpmo-utils allows < 4.53). stepaudio2 (minicpmo-utils[tts]) is the
  # voice decoder; librosa 0.9 imports pkg_resources, gone from setuptools 80.
  - >-
    pip install --no-cache-dir "minicpmo-utils[tts]==1.0.6" "transformers==4.51.3" "accelerate<1.8" "setuptools<80"
    safetensors huggingface_hub fastapi "uvicorn[standard]"
  - python -c "import stepaudio2, transformers, torch; print('live deps ok', transformers.__version__, torch.__version__)"
weights:
  - source: "hf://zhiyuantechnology/sona-minicpmo@de7da0de8ee5f1ef06780cda934e9da0eac61b31"  # live1: stage 1 + live-format LoRA
    mount_location: /app/models/live
    auth: {auth_method: CUSTOM_SECRET, auth_secret_name: hf_access_token}
    # Dotfiles out: the mirror dropped stage1's .complete marker and then refused the volume it had built (2 Oct:
    # "volume view file set mismatch … missing=[.complete]", retried until stopped).
    ignore_patterns: [".*", "lora-adapter/**", "assets/*.mp4", "assets/*.mp3", "assets/*.png", "assets/*.wav"]
  - source: "hf://zhiyuantechnology/sona-minicpmo@fe0d8603553696f88a7a06dc44ff6f53872e208c"  # voice-v1 (trained on stage 1's states)
    mount_location: /app/models/voice
    auth: {auth_method: CUSTOM_SECRET, auth_secret_name: hf_access_token}
    allow_patterns: ["talker.safetensors"]
docker_server:
  start_command: python /app/data/live.py
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/live
  server_port: 8000
secrets:
  hf_access_token: null
resources:
  accelerator: H100
  cpu: "4"
  memory: 32Gi
runtime:
  transport:
    kind: websocket
  predict_concurrency: 1
  health_checks:
    startup_threshold_seconds: 1800
    restart_threshold_seconds: 1200
