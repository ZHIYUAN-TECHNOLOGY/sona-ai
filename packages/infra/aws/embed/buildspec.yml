# Builds the embedder's image into ECR as sona/embed:300m. The weights, google/embeddinggemma-300m at revision
# 57c266a740f537b4dc058e1b0cda161fd15afa75 (gated on Hugging Face: accepted terms needed), were copied to
# s3://$BUCKET/embed/300m/ from a Hugging Face cache by hand:
#   aws s3 sync ~/.cache/huggingface/hub/models--google--embeddinggemma-300m/snapshots/57c266a7*/ s3://$BUCKET/embed/300m/ --follow-symlinks
# Build context: this folder (zipped to s3://$BUCKET/build/embed-src.zip, CodeBuild project sona-embed-image).
version: 0.2
phases:
  build:
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR
      - docker build -t $ECR/sona/embed:300m .
      - docker push $ECR/sona/embed:300m
